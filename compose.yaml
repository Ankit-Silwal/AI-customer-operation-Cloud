x-node: &node
  image: customer-ops-node:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  cpus: "1.0"
  mem_limit: 512m
  restart: unless-stopped

x-rate-env: &rate-env
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
  RATE_LIMIT_REDIS_URL: redis://:${REDIS_PASSWORD:-rate_limits_local}@redis:6379
  RATE_LIMIT_NAMESPACE: ${RATE_LIMIT_NAMESPACE:-customer-ops}
  RATE_LIMIT_POLICY_OVERRIDES: ${RATE_LIMIT_POLICY_OVERRIDES:-}

x-domain-env: &domain-env
  <<: *rate-env
  PORT: 3001
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  ORGANIZATIONS_URL: http://core:3001

services:
  web:
    image: customer-ops-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3030}:3000"
    environment:
      <<: *rate-env
      WEB_PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3030}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
      API_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  company-demo:
    image: customer-ops-demo:local
    build:
      context: .
      dockerfile: apps/company-demo/Dockerfile
    ports:
      - "${DEMO_PORT:-3035}:3005"
    environment:
      <<: *rate-env
      DEMO_PORT: 3005
      DEMO_ORIGIN: ${DEMO_ORIGIN:-http://localhost:3035}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
      API_URL: http://api:3001
      DEMO_OWNER_EMAIL: ${DEMO_OWNER_EMAIL:-care@oakandember.example}
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:-}
    depends_on:
      api: { condition: service_healthy }
      rag: { condition: service_healthy }
    restart: unless-stopped

  api:
    <<: *node
    command: ["node", "apps/api/dist/gateway/server.js"]
    ports:
      - "${PORT:-3001}:3001"
    environment:
      <<: *rate-env
      PORT: 3001
      CORE_URL: http://core:3001
      CONVERSATIONS_URL: http://conversations:3001
      DOCUMENTS_URL: http://documents:3001
      RAG_URL: http://rag:8000
      RATE_LIMIT_TRUST_FRONTEND: "true"
    depends_on:
      redis: { condition: service_healthy }
      core: { condition: service_healthy }
      conversations: { condition: service_healthy }
      documents: { condition: service_healthy }
      rag: { condition: service_started }

  core:
    <<: *node
    command: ["node", "apps/api/dist/server.js"]
    environment:
      <<: *domain-env
      SERVICE_ROLE: core
      DATABASE_URL: postgresql://identity_app:${IDENTITY_DB_PASSWORD:-identity_local}@postgres:5432/identity
      ORGANIZATIONS_DATABASE_URL: postgresql://organizations_app:${ORGANIZATIONS_DB_PASSWORD:-organizations_local}@postgres:5432/organizations
    depends_on:
      redis: { condition: service_healthy }
      migrate-identity: { condition: service_completed_successfully }
      migrate-organizations: { condition: service_completed_successfully }

  conversations:
    <<: *node
    image: customer-ops-conversation:local
    build:
      context: .
      dockerfile: apps/conversation-server/Dockerfile
    command: ["node", "apps/conversation-server/dist/server.js"]
    environment:
      <<: *domain-env
      SERVICE_ROLE: conversations
      DATABASE_URL: postgresql://conversations_app:${CONVERSATIONS_DB_PASSWORD:-conversations_local}@postgres:5432/conversations
    depends_on:
      redis: { condition: service_healthy }
      core: { condition: service_healthy }
      migrate-conversations: { condition: service_completed_successfully }

  documents:
    <<: *node
    image: customer-ops-document:local
    build:
      context: .
      dockerfile: apps/document-server/Dockerfile
    command: ["node", "apps/document-server/dist/server.js"]
    environment:
      <<: *domain-env
      SERVICE_ROLE: documents
      RAG_URL: http://rag:8000
      DATABASE_URL: postgresql://documents_app:${DOCUMENTS_DB_PASSWORD:-documents_local}@postgres:5432/documents
    depends_on:
      redis: { condition: service_healthy }
      core: { condition: service_healthy }
      migrate-documents: { condition: service_completed_successfully }

  migrate-identity:
    <<: *node
    restart: "no"
    command: ["node", "apps/api/dist/database/migrate.js"]
    environment:
      SERVICE_ROLE: identity
      DATABASE_URL: postgresql://identity_app:${IDENTITY_DB_PASSWORD:-identity_local}@postgres:5432/identity
    depends_on:
      postgres: { condition: service_healthy }

  migrate-organizations:
    <<: *node
    restart: "no"
    command: ["node", "apps/api/dist/database/migrate.js"]
    environment:
      SERVICE_ROLE: organizations
      DATABASE_URL: postgresql://organizations_app:${ORGANIZATIONS_DB_PASSWORD:-organizations_local}@postgres:5432/organizations
    depends_on:
      postgres: { condition: service_healthy }

  migrate-conversations:
    <<: *node
    image: customer-ops-conversation:local
    build:
      context: .
      dockerfile: apps/conversation-server/Dockerfile
    restart: "no"
    command: ["node", "apps/conversation-server/dist/database/migrate.js"]
    environment:
      SERVICE_ROLE: conversations
      DATABASE_URL: postgresql://conversations_app:${CONVERSATIONS_DB_PASSWORD:-conversations_local}@postgres:5432/conversations
    depends_on:
      postgres: { condition: service_healthy }

  migrate-documents:
    <<: *node
    image: customer-ops-document:local
    build:
      context: .
      dockerfile: apps/document-server/Dockerfile
    restart: "no"
    command: ["node", "apps/document-server/dist/database/migrate.js"]
    environment:
      SERVICE_ROLE: documents
      DATABASE_URL: postgresql://documents_app:${DOCUMENTS_DB_PASSWORD:-documents_local}@postgres:5432/documents
    depends_on:
      postgres: { condition: service_healthy }

  rag:
    ports:
      - "127.0.0.1:${RAG_PORT:-4102}:8000"
    image: customer-ops-rag:local
    build:
      context: .
      dockerfile: apps/rag/Dockerfile
    cpus: "2.0"
    mem_limit: 3g
    environment:
      <<: *rate-env
      RAG_MAX_CONCURRENCY: ${RAG_MAX_CONCURRENCY:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${api_key:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-learning_rag}
      QDRANT_CREATE_COLLECTION: ${QDRANT_CREATE_COLLECTION:-true}
      ORGANIZATIONS_URL: http://core:3001
      DOCUMENTS_URL: http://documents:3001
    volumes:
      - embedding_models:/models
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
      core: { condition: service_healthy }
      documents: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    cpus: "0.5"
    mem_limit: 256m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rate_limits_local}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-rate_limits_local}", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - rate_limit_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    cpus: "1.0"
    mem_limit: 1g
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6335}:6333"
    volumes:
      - rag_qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    cpus: "1.0"
    mem_limit: 1g
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customer_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer_ops_local}
      POSTGRES_DB: ${POSTGRES_DB:-customer_ops}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local}
      ORGANIZATIONS_DB_PASSWORD: ${ORGANIZATIONS_DB_PASSWORD:-organizations_local}
      CONVERSATIONS_DB_PASSWORD: ${CONVERSATIONS_DB_PASSWORD:-conversations_local}
      DOCUMENTS_DB_PASSWORD: ${DOCUMENTS_DB_PASSWORD:-documents_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - microservices_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  microservices_postgres_data:
  rag_qdrant_data:
  embedding_models:
  rate_limit_data:
