# Mounted as hba_file for the primary and replicas, so existing data volumes also get the
# replication entry (init scripts only run on an empty volume).
local   all          all                    trust
host    all          all     127.0.0.1/32   trust
host    all          all     ::1/128        trust
local   replication  all                    trust
host    replication  replicator  all        scram-sha-256
host    all          all     all            scram-sha-256
