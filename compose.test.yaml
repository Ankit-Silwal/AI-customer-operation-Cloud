services:
  redis-test:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:55479:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: customer_ops_test
      POSTGRES_PASSWORD: customer_ops_test
      POSTGRES_DB: customer_ops_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U customer_ops_test -d customer_ops_test"]
      interval: 2s
      timeout: 5s
      retries: 20
